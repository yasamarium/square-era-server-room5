name: Square Era Room Server Supervisor

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-room-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Server Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install --no-audit

      - name: Restore Latest World from Database Repository
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Restoring world snapshot from yasamarium/square-era-db-room5..."
          mkdir -p data
          curl -s -H "Authorization: token $GH_PAT" \
            https://raw.githubusercontent.com/yasamarium/square-era-db-room5/main/data/world.json -o data/world.json || true
          curl -s -H "Authorization: token $GH_PAT" \
            https://raw.githubusercontent.com/yasamarium/square-era-db-room5/main/data/players.json -o data/players.json || true
          curl -s -H "Authorization: token $GH_PAT" \
            https://raw.githubusercontent.com/yasamarium/square-era-db-room5/main/data/chat.json -o data/chat.json || true
          echo "World snapshot restored."

      - name: Run Room Server Daemon (4h50m Managed Cycle)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PORT: 8080
        run: |
          echo "========================================================"
          echo " Starting Square Era Room Server Daemon: Room 5 (Anarchy Wilds)"
          echo " 5-Hour Managed Supervisor Cycle with Live MQTT Bridge"
          echo "========================================================"
          node server.js &
          SERVER_PID=$!
          echo "Server daemon running with PID $SERVER_PID"

          # Periodic background backup committer every 15 minutes
          (
            while kill -0 $SERVER_PID 2>/dev/null; do
              sleep 900
              if [ -f data/world.json ]; then
                echo "[Backup] Performing periodic checkpoint push to square-era-db-room5..."
                git config --global user.name "SquareEra-SyncBot"
                git config --global user.email "syncbot@squareera.local"
                rm -rf /tmp/db_periodic
                git clone --quiet https://${GH_PAT}@github.com/yasamarium/square-era-db-room5.git /tmp/db_periodic
                mkdir -p /tmp/db_periodic/data
                cp -f data/world.json /tmp/db_periodic/data/world.json
                [ -f data/players.json ] && cp -f data/players.json /tmp/db_periodic/data/players.json
                [ -f data/chat.json ] && cp -f data/chat.json /tmp/db_periodic/data/chat.json
                cd /tmp/db_periodic
                git add data/
                if ! git diff-index --quiet HEAD --; then
                  git commit -m "Auto-sync periodic checkpoint [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
                  git push origin main || true
                  echo "[Backup] Periodic checkpoint successfully saved to square-era-db-room5!"
                fi
                cd - >/dev/null
              fi
            done
          ) &
          BACKUP_PID=$!

          # 4 hours 50 minutes (17400s)
          sleep 17400

          echo "Cycle boundary reached. Retriggering successor workflow..."
          node scripts/retrigger.js || echo "Retrigger completed or scheduled."

          echo "Gracefully terminating server daemon..."
          kill -TERM $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true
          kill $BACKUP_PID 2>/dev/null || true

      - name: Commit & Shift Accumulated Data to Database Repository
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "========================================================"
          echo " Committing and shifting all room data to square-era-db-room5 before restart..."
          echo "========================================================"
          git config --global user.name "SquareEra-SyncBot"
          git config --global user.email "syncbot@squareera.local"

          rm -rf db_repo
          git clone https://${GH_PAT}@github.com/yasamarium/square-era-db-room5.git db_repo
          mkdir -p db_repo/data

          if [ -f data/world.json ]; then
            cp -f data/world.json db_repo/data/world.json
          fi
          if [ -f data/players.json ]; then
            cp -f data/players.json db_repo/data/players.json
          fi
          if [ -f data/chat.json ]; then
            cp -f data/chat.json db_repo/data/chat.json
          fi

          cd db_repo
          git add data/
          if git diff-index --quiet HEAD --; then
            echo "No world modifications in this cycle. DB already in sync."
          else
            git commit -m "Auto-sync world modifications and player state before restart [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push origin main
            echo "SUCCESS: 100% of room activities shifted to database repo before restart!"
          fi
